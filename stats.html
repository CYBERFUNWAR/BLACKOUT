<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST:// Statistiques — BLACKOUT</title>
<style>
  :root{
    --bg:#05070a; --panel:#0a0f16; --panel2:#0d141d;
    --cyan:#00e5ff; --cyan-d:#0097b2; --mag:#ff2e88;
    --green:#2fff9a; --amber:#ffce54; --grey:#6c7f93; --lgrey:#9fb0c2; --line:#15212e;
    --mono:ui-monospace,"Cascadia Code","Source Code Pro",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--lgrey);font-family:var(--mono);min-height:100vh}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.15) 3px,transparent 4px);mix-blend-mode:overlay;opacity:.4}
  .wrap{max-width:1100px;margin:0 auto;padding:26px 22px 60px;position:relative;z-index:1}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
  .logo{font-size:clamp(20px,4vw,30px);font-weight:700;letter-spacing:.04em}
  .logo .g{color:var(--cyan);text-shadow:0 0 14px rgba(0,229,255,.5)}
  .sub{font-size:11px;color:var(--mag);letter-spacing:.26em;margin-top:3px}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .fbtn{font-family:var(--mono);font-size:12px;letter-spacing:.06em;cursor:pointer;color:var(--grey);
    background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 13px}
  .fbtn.on{color:var(--cyan);border-color:var(--cyan-d);box-shadow:0 0 10px rgba(0,229,255,.15)}

  h2{font-size:12px;letter-spacing:.2em;color:var(--grey);margin:26px 0 12px;font-weight:700}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
  .kpi{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:6px;padding:16px 16px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
  .kpi .v{font-size:30px;font-weight:700;color:#eaf6ff;line-height:1;letter-spacing:.02em}
  .kpi .v small{font-size:15px;color:var(--grey)}
  .kpi .l{font-size:10.5px;letter-spacing:.14em;color:var(--grey);margin-top:8px}
  .kpi.g::before{background:var(--green)} .kpi.g .v{color:var(--green)}
  .kpi.m::before{background:var(--mag)} .kpi.a::before{background:var(--amber)}

  .modegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .modecard{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:16px}
  .modecard .mt{font-size:13px;font-weight:700;letter-spacing:.1em;margin-bottom:10px}
  .modecard.fam .mt{color:var(--green)} .modecard.std .mt{color:var(--cyan)} .modecard.exp .mt{color:var(--mag)}
  .modecard .line{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:var(--lgrey)}
  .modecard .line b{color:#eaf6ff}

  .blockwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
  .blockcard{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:16px}
  .blockcard .mt{font-size:12px;font-weight:700;letter-spacing:.1em;margin-bottom:12px;color:var(--amber)}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .bar .bl{font-size:11px;color:var(--grey);width:92px;flex-shrink:0}
  .bar .bt{flex:1;height:18px;background:#03060a;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .bar .bt > i{display:block;height:100%;background:linear-gradient(90deg,var(--mag),#7a1140);min-width:2px}
  .bar .bv{font-size:11px;color:var(--lgrey);width:30px;text-align:right}
  .bar.top .bt > i{background:linear-gradient(90deg,var(--amber),#b8860b)}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{font-size:10px;letter-spacing:.12em;color:var(--grey);font-weight:700}
  td .res-win{color:var(--green)} td .res-lose{color:var(--mag)}
  td .tag{font-size:10px;padding:2px 6px;border:1px solid var(--line);border-radius:3px;color:var(--grey)}

  .empty{text-align:center;color:var(--grey);font-size:15px;line-height:1.8;padding:60px 20px;border:1px dashed var(--line);border-radius:8px}
  .empty b{color:var(--cyan)}
  .status{text-align:center;font-size:11px;letter-spacing:.1em;margin-top:28px;color:var(--grey)}
  .status.on{color:var(--green)} .status.off{color:var(--mag)}
  .foot{margin-top:8px;text-align:center;font-size:10px;color:#33414f;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="logo"><span class="g">GHOST</span>:// <span style="font-size:.6em;color:var(--grey)">statistiques</span></div>
      <div class="sub">PROTOCOLE&nbsp;&nbsp;B L A C K O U T</div>
    </div>
    <div class="filters" id="filters">
      <button class="fbtn on" data-m="all" onclick="setFilter('all')">TOUS</button>
      <button class="fbtn" data-m="famille" onclick="setFilter('famille')">FAMILLE</button>
      <button class="fbtn" data-m="standard" onclick="setFilter('standard')">STANDARD</button>
      <button class="fbtn" data-m="expert" onclick="setFilter('expert')">EXPERT</button>
    </div>
  </header>
  <div id="body"></div>
  <div id="status" class="status">connexion au réseau…</div>
  <div class="foot">CYBER FUN — tableau de bord des parties</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const FIREBASE = {
  apiKey: "AIzaSyB5XC4hRui4JYuQY2jqTG_Sgmlu7y1MRh0",
  authDomain: "escape-saint-tropez.firebaseapp.com",
  projectId: "escape-saint-tropez",
  storageBucket: "escape-saint-tropez.firebasestorage.app",
  messagingSenderId: "976273690468",
  appId: "1:976273690468:web:bf14f308033851746bf471"
};
const COLLECTION = "stats_blackout";

let ROWS=[], FILTER='all';
const MODE_LABEL={famille:'FAMILLE',standard:'STANDARD',expert:'EXPERT'};
function esc(t){return (t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtTime(s){ s=Math.max(0,Math.round(s||0)); const m=Math.floor(s/60),x=s%60; return m+':'+String(x).padStart(2,'0'); }
function avg(a){ return a.length? a.reduce((x,y)=>x+y,0)/a.length : 0; }

window.setFilter=function(m){ FILTER=m; document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('on', b.dataset.m===m)); render(); };

function render(){
  const body=document.getElementById('body');
  const data = FILTER==='all' ? ROWS : ROWS.filter(r=>r.mode===FILTER);
  if(!ROWS.length){
    body.innerHTML='<div class="empty">Aucune partie enregistrée pour le moment.<br><br>Chaque partie terminée (gagnée ou perdue) sur un poste <b>BLACKOUT</b> alimentera ce tableau.</div>';
    return;
  }
  const total=data.length;
  const wins=data.filter(r=>r.result==='win');
  const winRate= total? Math.round(wins.length/total*100):0;
  const avgTimeWin= wins.length? fmtTime(avg(wins.map(r=>r.time))) : '—';
  const avgHints= total? avg(data.map(r=>r.hints||0)).toFixed(1):'0';
  const avgWrong= total? avg(data.map(r=>r.wrong||0)).toFixed(1):'0';
  const bestScore= data.length? Math.max(...data.map(r=>r.score||0)):0;

  let h='<h2>VUE D\'ENSEMBLE'+(FILTER!=='all'?(' · '+MODE_LABEL[FILTER]):'')+'</h2>';
  h+='<div class="kpis">'
    +kpi(total,'PARTIES JOUÉES','')
    +kpi(winRate,'TAUX DE RÉUSSITE','g','%')
    +kpi(avgTimeWin,'TEMPS MOYEN (réussites)','')
    +kpi(avgHints,'INDICES / PARTIE','a')
    +kpi(avgWrong,'ERREURS / PARTIE','m')
    +kpi(bestScore,'MEILLEUR SCORE','')
    +'</div>';

  // par mode
  if(FILTER==='all'){
    h+='<h2>PAR MODE</h2><div class="modegrid">';
    ['famille','standard','expert'].forEach(mo=>{
      const d=ROWS.filter(r=>r.mode===mo);
      if(!d.length){ return; }
      const wr=Math.round(d.filter(r=>r.result==='win').length/d.length*100);
      const at=d.filter(r=>r.result==='win');
      const cls=mo==='famille'?'fam':mo==='expert'?'exp':'std';
      h+='<div class="modecard '+cls+'"><div class="mt">'+MODE_LABEL[mo]+'</div>'
        +'<div class="line">Parties <b>'+d.length+'</b></div>'
        +'<div class="line">Réussite <b>'+wr+'%</b></div>'
        +'<div class="line">Temps moyen <b>'+(at.length?fmtTime(avg(at.map(r=>r.time))):'—')+'</b></div>'
        +'<div class="line">Indices moy. <b>'+avg(d.map(r=>r.hints||0)).toFixed(1)+'</b></div>'
        +'</div>';
    });
    h+='</div>';
  }

  // verrou qui bloque le plus (parmi les défaites)
  h+='<h2>VERROU QUI BLOQUE LE PLUS (défaites)</h2><div class="blockwrap">';
  const modes = FILTER==='all'?['famille','standard','expert']:[FILTER];
  let anyBlock=false;
  modes.forEach(mo=>{
    const losses=ROWS.filter(r=>r.mode===mo && r.result==='lose');
    if(!losses.length) return;
    anyBlock=true;
    const totV = Math.max.apply(null, losses.map(r=>r.total||4));
    // bloqué au verrou (done+1)
    const counts={}; for(let v=1;v<=totV;v++) counts[v]=0;
    losses.forEach(r=>{ const stuck=Math.min(totV,(r.done||0)+1); counts[stuck]=(counts[stuck]||0)+1; });
    const maxc=Math.max.apply(null,Object.values(counts))||1;
    const topV=Object.keys(counts).reduce((a,b)=>counts[b]>counts[a]?b:a,'1');
    const cls=mo==='famille'?'fam':mo==='expert'?'exp':'std';
    h+='<div class="blockcard"><div class="mt">'+MODE_LABEL[mo]+' · '+losses.length+' défaite(s)</div>';
    for(let v=1;v<=totV;v++){
      const w=Math.round(counts[v]/maxc*100);
      h+='<div class="bar'+(String(v)===topV&&counts[v]>0?' top':'')+'"><div class="bl">Verrou '+(v<10?'0':'')+v+'</div>'
        +'<div class="bt"><i style="width:'+w+'%"></i></div><div class="bv">'+counts[v]+'</div></div>';
    }
    h+='</div>';
  });
  if(!anyBlock){ h+='<div class="empty" style="padding:30px">Aucune défaite enregistrée '+(FILTER!=='all'?'dans ce mode':'')+' — bravo aux équipes !</div>'; }
  h+='</div>';

  // dernières parties
  h+='<h2>DERNIÈRES PARTIES</h2>';
  const recent=data.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,25);
  h+='<table><thead><tr><th>ÉQUIPE</th><th>MODE</th><th>JEU</th><th>RÉSULTAT</th><th style="text-align:right">SCORE</th><th style="text-align:right">TEMPS</th><th style="text-align:center">VERROUS</th><th>DATE</th></tr></thead><tbody>';
  recent.forEach(r=>{
    const dt=r.date?new Date(r.date):new Date(r.ts||0);
    const dstr=dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    h+='<tr><td>'+esc(r.team)+'</td>'
      +'<td><span class="tag">'+(MODE_LABEL[r.mode]||r.mode||'?')+'</span></td>'
      +'<td>'+(r.variant||'-')+'</td>'
      +'<td class="'+(r.result==='win'?'res-win':'res-lose')+'">'+(r.result==='win'?'✓ réussi ('+(r.rank||'')+')':'✕ échoué')+'</td>'
      +'<td style="text-align:right;color:#eaf6ff">'+(r.result==='win'?(r.score||0):'—')+'</td>'
      +'<td style="text-align:right">'+(r.result==='win'?fmtTime(r.time):'—')+'</td>'
      +'<td style="text-align:center">'+(r.done||0)+'/'+(r.total||0)+'</td>'
      +'<td style="color:var(--grey)">'+dstr+'</td></tr>';
  });
  h+='</tbody></table>';
  body.innerHTML=h;
}
function kpi(v,l,cls,unit){
  return '<div class="kpi '+(cls||'')+'"><div class="v">'+v+(unit?'<small>'+unit+'</small>':'')+'</div><div class="l">'+l+'</div></div>';
}

const st=document.getElementById('status');
try{
  const app=initializeApp(FIREBASE); const db=getFirestore(app);
  onSnapshot(collection(db, COLLECTION), snap=>{
    ROWS=snap.docs.map(d=>d.data());
    st.className='status on'; st.textContent='🌐 connecté — '+ROWS.length+' partie(s) enregistrée(s)';
    render();
  }, err=>{ st.className='status off'; st.textContent='⚠ connexion impossible (règles Firestore ?)'; });
}catch(e){ st.className='status off'; st.textContent='⚠ Firebase indisponible'; }
render();
</script>
</body>
</html>
