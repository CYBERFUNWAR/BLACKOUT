<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST:// Nœuds-relais — BLACKOUT</title>
<style>
  :root{
    --bg:#05070a; --panel:#0a0f16; --panel2:#0d141d;
    --cyan:#00e5ff; --cyan-d:#0097b2; --mag:#ff2e88;
    --green:#2fff9a; --amber:#ffce54; --grey:#6c7f93; --lgrey:#9fb0c2; --line:#15212e;
    --mono:ui-monospace,"Cascadia Code","Source Code Pro",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--lgrey);font-family:var(--mono);line-height:1.55;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.18) 3px,transparent 4px);
    mix-blend-mode:overlay;opacity:.5}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:59;
    background:radial-gradient(ellipse at 50% 35%,transparent 42%,rgba(0,0,0,.55) 100%)}
  .wrap{max-width:560px;margin:0 auto;padding:26px 18px 50px;position:relative;z-index:1}
  .logo{font-weight:700;font-size:16px;letter-spacing:.04em}
  .logo .g{color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,.5)}
  .brand{font-size:11px;color:var(--grey);letter-spacing:.28em;margin:2px 0 22px}

  .node{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));
    border-radius:4px;padding:22px 18px;position:relative;overflow:hidden}
  .node::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mag);box-shadow:0 0 16px var(--mag)}
  .ntag{font-size:11px;letter-spacing:.2em;color:var(--mag);font-weight:700}
  .ntitle{font-size:22px;color:#eaf6ff;font-weight:700;letter-spacing:.05em;margin:6px 0 4px}
  .nsub{font-size:12px;color:var(--grey);margin-bottom:18px}
  .puzzle{background:#03060a;border:1px solid var(--line);border-radius:3px;padding:18px 16px;margin-bottom:16px}
  .puzzle .q{font-size:14px;color:var(--lgrey);margin-bottom:14px}
  .puzzle .big{font-size:30px;font-weight:700;letter-spacing:.14em;color:var(--cyan);text-align:center;
    text-shadow:0 0 16px rgba(0,229,255,.35);margin:8px 0 4px}
  .puzzle .hintmini{font-size:11px;color:var(--grey);text-align:center;margin-top:6px}
  .inrow{display:flex;gap:10px}
  .inrow input{flex:1;font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:.16em;
    text-align:center;color:var(--green);background:#03060a;border:1px solid var(--cyan-d);border-radius:3px;
    padding:13px;outline:none}
  .inrow input:focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(0,229,255,.2)}
  .inrow input.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .btn{font-family:var(--mono);font-weight:700;letter-spacing:.12em;font-size:14px;cursor:pointer;
    color:var(--bg);background:var(--cyan);border:none;padding:13px 20px;border-radius:3px;
    box-shadow:0 0 18px rgba(0,229,255,.32)}
  .btn:hover{box-shadow:0 0 26px rgba(0,229,255,.5)}
  .btn.mag{background:var(--mag);color:#fff;box-shadow:0 0 18px rgba(255,46,136,.4)}
  .msg{min-height:22px;margin-top:14px;font-size:13px}
  .msg.err{color:var(--mag)} .msg.ok{color:var(--green)}
  .reveal{margin-top:16px;border:1px solid var(--green);background:rgba(47,255,154,.06);border-radius:3px;
    padding:16px;text-align:center;display:none;animation:fade .5s}
  .reveal.show{display:block}
  .reveal .pos{font-size:11px;letter-spacing:.2em;color:var(--grey)}
  .reveal .digit{font-size:46px;font-weight:700;color:var(--green);text-shadow:0 0 18px rgba(47,255,154,.4);line-height:1.1}
  .reveal .note{font-size:12px;color:var(--lgrey);margin-top:6px}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .foot{margin-top:24px;text-align:center;font-size:10.5px;color:#33414f;letter-spacing:.08em}

  /* accueil / 404 */
  .home{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:22px 18px}
  .home h1{color:var(--cyan);font-size:18px;letter-spacing:.06em;margin-bottom:10px}
  .home p{font-size:13px;margin-bottom:10px}
  .home code{color:var(--amber);background:#03060a;padding:2px 6px;border-radius:3px}

  /* régie QR */
  .qrgen label{display:block;font-size:12px;color:var(--grey);letter-spacing:.1em;margin:14px 0 6px}
  .qrgen input[type=text]{width:100%;font-family:var(--mono);font-size:13px;color:var(--cyan);
    background:#03060a;border:1px solid var(--cyan-d);border-radius:3px;padding:11px 12px;outline:none}
  .qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .qrcard{border:1px solid var(--line);border-radius:4px;background:#fff;padding:12px;text-align:center}
  .qrcard .lab{background:#0a0e14;color:#fff;font-size:11px;letter-spacing:.1em;padding:6px;margin:-12px -12px 10px;font-weight:700}
  .qrcard img,.qrcard canvas{width:100%;max-width:160px;height:auto;image-rendering:pixelated}
  .qrcard .cap{font-size:10px;color:#0a0e14;margin-top:8px;font-weight:700;letter-spacing:.08em}
  .note2{font-size:11px;color:var(--grey);margin-top:16px;line-height:1.6}
  .note2 b{color:var(--cyan)}

  @media print{
    body{background:#fff}
    body::before,body::after{display:none}
    .noprint{display:none!important}
    .wrap{max-width:100%}
    .qrcard{border:1px solid #000;break-inside:avoid}
    .qrgrid{gap:24px}
    .qrcard .lab{color:#fff;background:#0a0e14;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

  /* ---- Habillage (œil ORACLE + fond) ---- */
  #bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.12;pointer-events:none}
  .oracle-eye{display:inline-block;--eye:118px;line-height:0}
  .oracle-eye svg{width:var(--eye);height:var(--eye);display:block;margin:0 auto;overflow:visible}
  .oracle-eye .er{fill:none;stroke:var(--cyan-d);stroke-width:1.4;opacity:.6}
  .oracle-eye .er1{stroke-dasharray:7 11;animation:eyespin 16s linear infinite;transform-origin:50% 50%}
  .oracle-eye .er2{stroke-dasharray:3 8;animation:eyespin 10s linear infinite reverse;transform-origin:50% 50%}
  .oracle-eye .socket{fill:#03070b;stroke:#12242e;stroke-width:1}
  .oracle-eye .iris{filter:drop-shadow(0 0 6px rgba(0,229,255,.5));transform-box:fill-box;transform-origin:center;animation:irispulse 3.2s ease-in-out infinite}
  .oracle-eye .pupil{fill:#02080c}
  .oracle-eye .glint{fill:#e6fdff;opacity:.85}
  .oracle-eye .scanl{stroke:rgba(0,229,255,.55);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:eyescan 3.6s ease-in-out infinite}
  @keyframes eyespin{to{transform:rotate(360deg)}}
  @keyframes irispulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes eyescan{0%,100%{transform:translateY(-13px);opacity:0}50%{transform:translateY(13px);opacity:.55}}
  .cflogo{display:block;max-height:58px;max-width:220px;opacity:.9;margin:18px auto 0;filter:drop-shadow(0 0 10px rgba(0,229,255,.2))}
</style>
</head>
<body>
<canvas id="bgfx" class="noprint"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="irisGrad" cx="50%" cy="44%" r="56%"><stop offset="0%" stop-color="#8ff6ff"/><stop offset="42%" stop-color="#00e5ff"/><stop offset="80%" stop-color="#0097b2"/><stop offset="100%" stop-color="#04141b"/></radialGradient></defs></svg>
<div class="wrap">
  <div class="logo noprint"><span class="g">GHOST</span>:// <span style="color:var(--grey);font-size:12px">accès distant</span></div>
  <div class="brand noprint">PROTOCOLE&nbsp;&nbsp;B L A C K O U T&nbsp;&nbsp;//&nbsp;&nbsp;NŒUDS-RELAIS</div>
  <div class="oracle-eye noprint" style="display:block;margin:12px auto 6px"><svg viewBox="0 0 100 100"><circle class="er er1" cx="50" cy="50" r="47"/><circle class="er er2" cx="50" cy="50" r="40"/><circle class="socket" cx="50" cy="50" r="31"/><circle class="iris" cx="50" cy="50" r="22" fill="url(#irisGrad)"/><circle class="pupil" cx="50" cy="50" r="8"/><circle class="glint" cx="43" cy="43" r="3"/><line class="scanl" x1="22" y1="50" x2="78" y2="50"/></svg></div>
  <div id="view"></div>
  <div class="foot noprint">CYBER FUN — Escape game cyberpunk · nœud-relais sécurisé</div>
</div>

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

function gameVariant(){ var m=(location.search||"").match(/[?&]g=([ABC])/i); return m?m[1].toUpperCase():"A"; }
function curSet(){ return SETS[gameVariant()]||SETS.A; }

function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");}

function renderNode(key){
  const n=curSet()[key]; const v=document.getElementById('view');
  v.innerHTML=`
   <div class="node">
     <div class="ntag">// INTRUSION — ${n.title} · JEU ${gameVariant()}</div>
     <div class="ntitle">Épreuve d'accès</div>
     <div class="nsub">Résolvez pour extraire votre fragment de fréquence.</div>
     <div class="puzzle">
       <div class="q">${n.q}</div>
       <div class="big">${n.big}</div>
       <div class="hintmini">${n.hintmini}</div>
     </div>
     <div class="inrow">
       <input id="ans" inputmode="numeric" autocomplete="off" placeholder="réponse" 
              onkeydown="if(event.key==='Enter')check('${key}')">
       <button class="btn" onclick="check('${key}')">DÉCRYPTER ▸</button>
     </div>
     <div id="msg" class="msg"></div>
     <div id="reveal" class="reveal">
       <div class="pos">FRÉQUENCE — POSITION ${n.pos}</div>
       <div class="digit">${n.result}</div>
       <div class="note">${n.note}</div>
     </div>
   </div>`;
  setTimeout(()=>{const a=document.getElementById('ans');if(a)a.focus();},150);
}
let tries={};
function check(key){
  const n=curSet()[key]; const inp=document.getElementById('ans');
  const msg=document.getElementById('msg'); const val=norm(inp.value);
  if(!val){inp.focus();return;}
  if(n.answer.map(norm).includes(val)){
    msg.className='msg ok'; msg.textContent='✓ NŒUD COMPROMIS — fragment de fréquence extrait.';
    document.getElementById('reveal').classList.add('show');
    inp.disabled=true;
  }else{
    tries[key]=(tries[key]||0)+1;
    msg.className='msg err'; msg.textContent='✕ Réponse rejetée — le nœud reste verrouillé. ('+tries[key]+' tentative'+(tries[key]>1?'s':'')+')';
    inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400); inp.select();
  }
}

/* ============ RÉGIE — GÉNÉRATEUR DE QR ============ */
function baseURL(){
  return (location.origin==='null'?'':location.origin)+location.pathname;
}
function renderQR(){
  const v=document.getElementById('view');
  v.innerHTML=`
   <div class="home qrgen">
     <h1>// RÉGIE — Génération des QR codes</h1>
     <p>Voici les 4 QR codes des nœuds-relais. Ils pointent automatiquement vers la page hébergée. Imprimez, découpez et cachez-les avant la partie.</p>
     <label>Jeu d'énigmes (doit correspondre au jeu lancé sur le terminal)</label>
     <select id="qrgame" onchange="buildQR()">
       <option value="A">Jeu A · BLACKOUT — code 4271</option>
       <option value="B">Jeu B · OVERRIDE — code 5386</option>
       <option value="C">Jeu C · SHUTDOWN — code 9147</option>
     </select>
     <div id="qrcodeinfo" class="note2" style="margin:10px 0"></div>
     <label>URL de base (détectée — modifiable si besoin)</label>
     <input id="baseurl" type="text" value="">
     <button class="btn" style="margin-top:12px" onclick="buildQR()">↻ Générer les QR</button>
     <button class="btn mag" style="margin-top:12px" onclick="window.print()">🖨 Imprimer</button>
     <div id="qrgrid" class="qrgrid"></div>
     <div class="note2">
       <b>Important :</b> générez les QR depuis la version <b>hébergée (https://…)</b>, pas en local (file://),
       sinon les smartphones ne pourront pas les ouvrir.<br>
       Chaque QR ouvre une épreuve : A→#A, B→#B, C→#C, D→#D.
     </div>
   </div>`;
  document.getElementById('baseurl').value=baseURL();
  var gsel=document.getElementById('qrgame'); if(gsel) gsel.value=gameVariant();
  buildQR();
}
function makeQR(target,text){
  target.innerHTML="";
  try{
    const qr=qrcode(0,'M'); qr.addData(text); qr.make();
    target.innerHTML=qr.createImgTag(5,8); // cellSize, margin
    const img=target.querySelector('img'); if(img){img.style.width='100%';img.style.maxWidth='160px';img.style.height='auto';}
  }catch(e){ target.textContent='QR error'; }
}
function buildQR(){
  let base=document.getElementById('baseurl').value.trim();
  if(base.includes('#')) base=base.split('#')[0];
  if(base.includes('?')) base=base.split('?')[0];
  const g=(document.getElementById('qrgame')||{}).value||'A';
  const info=document.getElementById('qrcodeinfo');
  if(info) info.innerHTML='Jeu <b>'+g+'</b> — code attendu sur le terminal : <b style="color:var(--amber)">'+(SETS[g]?SETS[g].code:'?')+'</b>. Chaque QR encode <code>?g='+g+'</code>, il ouvre donc l\'épreuve du bon jeu.';
  const grid=document.getElementById('qrgrid'); grid.innerHTML='';
  ['A','B','C','D'].forEach(k=>{
    const url=base+'?g='+g+'#'+k;
    const card=document.createElement('div'); card.className='qrcard';
    card.innerHTML=`<div class="lab">GHOST:// NŒUD ${k} · JEU ${g}</div><div class="qrimg"></div><div class="cap">[ ${k} ] scannez ce nœud</div>`;
    grid.appendChild(card);
    makeQR(card.querySelector('.qrimg'),url);
  });
}

/* ============ ROUTAGE ============ */
function renderHome(){
  document.getElementById('view').innerHTML=`
   <div class="home">
     <h1>// NŒUD-RELAIS GHOST://</h1>
     <p>Cette adresse héberge les nœuds-relais de l'opération BLACKOUT. Vous y accédez normalement en <b>scannant un QR code</b> trouvé dans la zone d'intrusion.</p>
     <p>Accès directs : <code>#A</code> <code>#B</code> <code>#C</code> <code>#D</code> &nbsp;·&nbsp; jeu actif : <b>${gameVariant()}</b> (ajoutez <code>?g=A/B/C</code> pour changer de jeu)</p>
     <p style="color:var(--grey);margin-top:14px">Animateur : ouvrez <code>#qr</code> pour générer et imprimer les QR codes.</p>
   </div>`;
}
function route(){
  const h=(location.hash||'').replace('#','').toUpperCase();
  if(h==='QR'||h==='REGIE') return renderQR();
  if(curSet()[h]) return renderNode(h);
  renderHome();
}
window.addEventListener('hashchange',route);
route();

<script>
(function(){try{
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cv=document.getElementById('bgfx');if(!cv)return;var ctx=cv.getContext('2d'),cols,drops,last=0;
  var CH='0123456789ABCDEF<>/[]{}=+*GHOST'.split('');
  function resize(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/16);drops=new Array(cols).fill(0).map(function(){return Math.random()*cv.height/16;});}
  resize();addEventListener('resize',resize);
  function frame(t){requestAnimationFrame(frame);if(t-last<70)return;last=t;
    ctx.fillStyle='rgba(5,7,10,0.22)';ctx.fillRect(0,0,cv.width,cv.height);ctx.font='14px monospace';
    for(var i=0;i<cols;i++){var txt=CH[Math.floor(Math.random()*CH.length)],x=i*16,y=drops[i]*16;
      ctx.fillStyle=Math.random()<0.04?'rgba(0,229,255,0.9)':'rgba(0,160,185,0.5)';ctx.fillText(txt,x,y);
      if(y>cv.height&&Math.random()>0.975)drops[i]=0;drops[i]+=0.5+Math.random()*0.4;}}
  requestAnimationFrame(frame);
}catch(e){}})();
</script>
