<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GHOST:// Connexion au nœud — BLACKOUT</title>
<style>
  :root{
    --bg:#05070a; --panel:#0a0f16; --panel2:#0d141d;
    --cyan:#00e5ff; --cyan-d:#0097b2; --mag:#ff2e88;
    --green:#2fff9a; --amber:#ffce54; --grey:#6c7f93; --lgrey:#9fb0c2; --line:#15212e;
    --mono:ui-monospace,"Cascadia Code","Source Code Pro",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--lgrey);font-family:var(--mono);line-height:1.5;min-height:100vh;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.18) 3px,transparent 4px);mix-blend-mode:overlay;opacity:.5}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 44px;position:relative;z-index:1}
  .logo{font-weight:700;font-size:15px;letter-spacing:.04em}
  .logo .g{color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,.5)}
  .brand{font-size:10px;color:var(--grey);letter-spacing:.26em;margin:2px 0 18px}
  .card{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:5px;padding:18px 16px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mag);box-shadow:0 0 14px var(--mag)}
  .tag{font-size:10px;letter-spacing:.2em;color:var(--mag);font-weight:700}
  .ttl{font-size:20px;color:#eaf6ff;font-weight:700;letter-spacing:.04em;margin:5px 0 4px}
  .sub{font-size:12px;color:var(--grey);margin-bottom:16px}
  .sess{font-size:11px;color:var(--cyan);letter-spacing:.14em;margin-bottom:14px}

  .route{background:#03060a;border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:16px}
  .route h4{font-size:10px;letter-spacing:.18em;color:var(--amber);margin-bottom:9px;font-weight:700}
  .rrow{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
  .rrow:last-child{margin-bottom:0}
  .chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px}
  .sw{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:3px;border:1px solid rgba(255,255,255,.3);font-size:10px;font-weight:700;color:#05070a;text-shadow:0 0 2px rgba(255,255,255,.6)}
  .arr{color:var(--grey)}

  .board{position:relative;margin-bottom:8px}
  .cols{display:flex;justify-content:space-between;gap:70px}
  .col{display:flex;flex-direction:column;gap:16px;flex:1}
  .port{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;padding:8px;border:1px solid var(--line);border-radius:5px;background:#0a1118;transition:border-color .12s,box-shadow .12s}
  .col.right .port{flex-direction:row-reverse}
  .port .dot{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.35);flex-shrink:0;font-size:12px;font-weight:700;color:#05070a;text-shadow:0 0 2px rgba(255,255,255,.7)}
  .port .pl{font-size:11px;color:var(--grey);letter-spacing:.08em}
  .codetag{min-width:40px;text-align:center;font-weight:700;font-size:17px;letter-spacing:.04em;color:#eaf6ff;background:#1b222b;border:1px solid #39454f;border-radius:4px;padding:5px 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);font-variant-numeric:tabular-nums;flex-shrink:0}
  .port.done .codetag{color:var(--green);border-color:var(--green)}
  .port.sel .codetag{border-color:var(--cyan);color:var(--cyan)}
  .port.wired{border-color:var(--amber)}
  .port.wired .codetag{color:var(--amber);border-color:var(--amber)}
  svg.links.tentative line{stroke:var(--amber);filter:drop-shadow(0 0 4px rgba(255,206,84,.45))}
  .breakerbtn{font-family:var(--mono);font-weight:700;letter-spacing:.1em;font-size:14px;cursor:pointer;width:100%;margin-top:4px;margin-bottom:8px;color:var(--bg);background:var(--amber);border:none;border-radius:4px;padding:15px;box-shadow:0 0 18px rgba(255,206,84,.3)}
  .breakerbtn:active{transform:translateY(1px)}
  .port.sel{border-color:var(--cyan);box-shadow:0 0 14px rgba(0,229,255,.3)}
  .port.done{border-color:var(--green);opacity:.85}
  .port.done .dot{border-color:var(--green)}
  svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  svg.links line{stroke:var(--green);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(47,255,154,.5))}

  .msg{min-height:22px;margin:14px 0 4px;font-size:13px;text-align:center}
  .msg.err{color:var(--mag)} .msg.ok{color:var(--green)}
  .btn{font-family:var(--mono);font-weight:700;letter-spacing:.1em;font-size:13px;cursor:pointer;color:var(--cyan);background:transparent;border:1px solid var(--cyan-d);border-radius:4px;padding:11px 16px;width:100%;margin-top:6px}
  .btn:active{background:rgba(0,229,255,.1)}

  .done-screen{text-align:center;padding:30px 10px}
  .done-screen .big{font-size:40px;font-weight:700;color:var(--green);text-shadow:0 0 26px rgba(47,255,154,.4);line-height:1.1;letter-spacing:.06em}
  .done-screen .d2{color:var(--lgrey);font-size:14px;margin-top:14px}
  .done-screen .d3{color:var(--grey);font-size:12px;margin-top:16px}
  .notice{text-align:center;color:var(--grey);font-size:13px;line-height:1.7;padding:30px 12px}
  .notice b{color:var(--cyan)}
  .foot{margin-top:22px;text-align:center;font-size:10px;color:#33414f;letter-spacing:.08em}
  .status{font-size:10px;text-align:center;margin-top:10px;color:var(--grey)}
  .status.on{color:var(--green)} .status.off{color:var(--mag)}

  /* ---- Habillage (œil ORACLE + fond) ---- */
  #bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.12;pointer-events:none}
  .oracle-eye{display:inline-block;--eye:118px;line-height:0}
  .oracle-eye svg{width:var(--eye);height:var(--eye);display:block;margin:0 auto;overflow:visible}
  .oracle-eye .er{fill:none;stroke:var(--cyan-d);stroke-width:1.4;opacity:.6}
  .oracle-eye .er1{stroke-dasharray:7 11;animation:eyespin 16s linear infinite;transform-origin:50% 50%}
  .oracle-eye .er2{stroke-dasharray:3 8;animation:eyespin 10s linear infinite reverse;transform-origin:50% 50%}
  .oracle-eye .socket{fill:#03070b;stroke:#12242e;stroke-width:1}
  .oracle-eye .iris{filter:drop-shadow(0 0 6px rgba(0,229,255,.5));transform-box:fill-box;transform-origin:center;animation:irispulse 3.2s ease-in-out infinite}
  .oracle-eye .pupil{fill:#02080c}
  .oracle-eye .glint{fill:#e6fdff;opacity:.85}
  .oracle-eye .scanl{stroke:rgba(0,229,255,.55);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:eyescan 3.6s ease-in-out infinite}
  @keyframes eyespin{to{transform:rotate(360deg)}}
  @keyframes irispulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes eyescan{0%,100%{transform:translateY(-13px);opacity:0}50%{transform:translateY(13px);opacity:.55}}
  .cflogo{display:block;max-height:58px;max-width:220px;opacity:.9;margin:18px auto 0;filter:drop-shadow(0 0 10px rgba(0,229,255,.2))}

  #pfxflash{position:fixed;inset:0;z-index:999;pointer-events:none;opacity:0;background:transparent}
  #pfxflash.on{animation:pfxfl .55s ease-out}
  @keyframes pfxfl{0%{opacity:.85}100%{opacity:0}}
  .oracle-eye.alert .iris{fill:#ff6a7f !important;filter:drop-shadow(0 0 10px rgba(255,45,85,.7))}
</style>
</head>
<body>
<canvas id="bgfx"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="irisGrad" cx="50%" cy="44%" r="56%"><stop offset="0%" stop-color="#8ff6ff"/><stop offset="42%" stop-color="#00e5ff"/><stop offset="80%" stop-color="#0097b2"/><stop offset="100%" stop-color="#04141b"/></radialGradient></defs></svg>
<div class="wrap">
  <div class="logo"><span class="g">GHOST</span>:// <span style="color:var(--grey);font-size:11px">nœud-relais</span></div>
  <div class="brand">PROTOCOLE&nbsp;&nbsp;B L A C K O U T</div>
  <div class="oracle-eye" style="display:block;margin:12px auto 6px"><svg viewBox="0 0 100 100"><circle class="er er1" cx="50" cy="50" r="47"/><circle class="er er2" cx="50" cy="50" r="40"/><circle class="socket" cx="50" cy="50" r="31"/><circle class="iris" cx="50" cy="50" r="22" fill="url(#irisGrad)"/><circle class="pupil" cx="50" cy="50" r="8"/><circle class="glint" cx="43" cy="43" r="3"/><line class="scanl" x1="22" y1="50" x2="78" y2="50"/></svg></div>
  <div id="view"></div>
  <div class="foot">CYBER FUN — connexion sécurisée au nœud</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ===== CONFIG (identique au terminal) ===== */
const FIREBASE = {
  apiKey: "AIzaSyB5XC4hRui4JYuQY2jqTG_Sgmlu7y1MRh0",
  authDomain: "escape-saint-tropez.firebaseapp.com",
  projectId: "escape-saint-tropez",
  storageBucket: "escape-saint-tropez.firebasestorage.app",
  messagingSenderId: "976273690468",
  appId: "1:976273690468:web:bf14f308033851746bf471"
};
const COLLECTION = "relais_blackout";
const CABLES = 4;        // routage couleurs (mode NORMAL)
const WIRE_PAIRS = 6;    // wire box (mode EXPERT)
function urlVariant(){ const m=(location.hash||'').match(/V=([a-z]+)/i); return m?m[1].toLowerCase():'routage'; }
const VARIANT = urlVariant();

/* ===== Palette de câbles ===== */
const COLORS = [
  {id:"R", name:"ROUGE",  hex:"#ff3b3b"},
  {id:"V", name:"VERT",   hex:"#2fff9a"},
  {id:"B", name:"BLEU",   hex:"#00e5ff"},
  {id:"J", name:"JAUNE",  hex:"#ffce54"},
  {id:"P", name:"VIOLET", hex:"#b36bff"},
  {id:"O", name:"ORANGE", hex:"#ff8c3b"}
];

/* ===== Session + identité ===== */
function sessionCode(){ const m=(location.hash||'').match(/S=([A-Z0-9]+)/i); return m?m[1].toUpperCase():null; }
function playerId(){
  let p; try{ p=localStorage.getItem('blackout_pid'); }catch(e){}
  if(!p){ p='a'+Math.random().toString(36).slice(2,8); try{localStorage.setItem('blackout_pid',p);}catch(e){} }
  return p;
}
const SESSION=sessionCode(), PID=playerId();

/* ===== Firebase ===== */
let db=null, online=false;
try{ const app=initializeApp(FIREBASE); db=getFirestore(app); online=true; }catch(e){ online=false; }

/* ===== effets envoyés par le PC (voix ORACLE + glitch) ===== */
function unlockPhoneAudio(){
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state!=='running') ac.resume(); }catch(e){}
  try{ if(window.speechSynthesis){ var u=new SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); } }catch(e){}
}
window.addEventListener('pointerdown', unlockPhoneAudio);
window.addEventListener('touchstart', unlockPhoneAudio);
/* garder l'écran allumé tant que la page relais est ouverte (anti-veille auto) */
var _wakeLock=null;
async function requestWakeLock(){
  try{
    if(('wakeLock' in navigator) && document.visibilityState==='visible' && !_wakeLock){
      _wakeLock=await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release', function(){ _wakeLock=null; });
    }
  }catch(e){ _wakeLock=null; }
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible'){ _wakeLock=null; requestWakeLock(); } });
window.addEventListener('pointerdown', requestWakeLock);
window.addEventListener('touchstart', requestWakeLock);
requestWakeLock();
function speakPhone(txt){
  try{ if(!window.speechSynthesis || !txt) return;
    var u=new SpeechSynthesisUtterance(txt); u.lang='fr-FR'; u.pitch=0.5; u.rate=0.95; u.volume=1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function phoneFlash(col){
  var fdiv=document.getElementById('pfxflash');
  if(!fdiv){ fdiv=document.createElement('div'); fdiv.id='pfxflash'; document.body.appendChild(fdiv); }
  fdiv.style.background=col; fdiv.classList.remove('on'); void fdiv.offsetWidth; fdiv.classList.add('on');
  var eye=document.querySelector('.oracle-eye');
  if(eye){ eye.classList.add('alert'); setTimeout(function(){ eye.classList.remove('alert'); }, 1500); }
}
var _pfxLast=null, _pfxReady=false;
function buzz(pattern){ try{ if(navigator && navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
function applyPhoneFx(d){
  if(!d || !d.nonce || d.nonce===_pfxLast) return; _pfxLast=d.nonce;
  if(d.kind==='speak'){ phoneFlash('rgba(0,229,255,.16)'); buzz(220); speakPhone(d.text); }
  else if(d.kind==='glitch'){ phoneFlash('rgba(255,45,85,.26)'); buzz([90,45,150]); sfx('error', function(){ beep(140,0.2); }); }
}
if(db && SESSION){
  try{
    onSnapshot(doc(db,'phonefx_blackout',SESSION), function(snap){
      if(!snap.exists()){ _pfxReady=true; return; }
      var d=snap.data();
      if(!_pfxReady){ _pfxReady=true; _pfxLast=d.nonce; return; }  // ne pas rejouer l'évènement déjà présent au chargement
      applyPhoneFx(d);
    });
  }catch(e){}
}

async function writePlayer(validated){
  if(!db||!SESSION) return false;
  try{ await setDoc(doc(db, COLLECTION, SESSION+'_'+PID), {session:SESSION, pid:PID, validated:!!validated, ts:Date.now()}); return true; }
  catch(e){ console.warn('write fail',e); return false; }
}

/* ===== Génération de l'énigme (routage de câbles) ===== */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function derangement(n){
  // permutation sans point fixe (aucun câble ne va "tout droit" vers sa propre couleur)
  while(true){ const p=shuffle([...Array(n).keys()]); if(p.every((v,i)=>v!==i)) return p; }
}
function genRoutage(){
  const pick=shuffle(COLORS).slice(0,CABLES);
  const perm=derangement(CABLES);
  const left = pick.map((c,i)=>({color:c, matchKey:pick[perm[i]].id}));
  const right = shuffle(pick).map(c=>({color:c, key:c.id}));
  return {variant:'routage', left, right};
}
const CODE_DIGITS=['2','3','4','5','6'], CODE_LETTERS=['a','b','c'];
function pickCodes(n, exclude){
  const all=[]; CODE_DIGITS.forEach(d=>CODE_LETTERS.forEach(l=>all.push(d+l)));
  return shuffle(all.filter(c=>!exclude.has(c))).slice(0,n);
}
function genWireBox(){
  const PAIRS=4, DEC=2;   // 4 vrais câbles à relier + 2 leurres de chaque côté
  let matched, dl, dr, dig;
  do{
    const used=new Set();
    matched=pickCodes(PAIRS, used); matched.forEach(c=>used.add(c));
    dl=pickCodes(DEC, used); dl.forEach(c=>used.add(c));
    dr=pickCodes(DEC, used); dr.forEach(c=>used.add(c));
    dig={}; matched.concat(dl,dr).forEach(c=>dig[c[0]]=(dig[c[0]]||0)+1);
  }while(Object.values(dig).filter(n=>n>=2).length < 2);   // au moins 2 familles confusables
  const left  = shuffle(matched.concat(dl)).map(code=>({code}));
  const right = shuffle(matched.concat(dr)).map(code=>({code}));
  return {variant:'wirebox', left, right, need:PAIRS};
}
function genPuzzle(){ return VARIANT==='wirebox' ? genWireBox() : genRoutage(); }

/* ===== État du jeu ===== */
let PZ=null, selLeft=null, links=[], confirmed=false;

function renderPuzzle(){
  const v=document.getElementById('view');
  const isWire = PZ.variant==='wirebox';
  let title, sub, instrBlock, leftPorts, rightPorts;
  if(isWire){
    title='WIRE BOX — câblage du nœud';
    sub='Reliez les codes <b>identiques</b> entre les deux colonnes. Certains n\'ont <b>pas de jumeau</b> : laissez-les. Puis abaissez le <b>disjoncteur</b> — la moindre erreur réinitialise tout.';
    instrBlock='';
    leftPorts=PZ.left.map((l,i)=>`<div class="port" id="L${i}" onclick="pickLeft(${i})"><span class="codetag">${l.code}</span><span class="pl">A${i+1}</span></div>`).join('');
    rightPorts=PZ.right.map((r,i)=>`<div class="port" id="R${i}" onclick="pickRight(${i})"><span class="codetag">${r.code}</span><span class="pl">B${i+1}</span></div>`).join('');
  } else {
    title='Routage des câbles';
    sub='Reliez chaque ENTRÉE à la bonne SORTIE en suivant la table de routage. Touchez une entrée, puis sa sortie.';
    const rows=PZ.left.map(l=>{ const t=COLORS.find(c=>c.id===l.matchKey);
      return `<div class="rrow"><span class="chip"><span class="sw" style="background:${l.color.hex}">${l.color.id}</span>${l.color.name}</span><span class="arr">▸</span><span class="chip"><span class="sw" style="background:${t.hex}">${t.id}</span>${t.name}</span></div>`;
    }).join('');
    instrBlock=`<div class="route"><h4>⚡ TABLE DE ROUTAGE</h4>${rows}</div>`;
    leftPorts=PZ.left.map((l,i)=>`<div class="port" id="L${i}" onclick="pickLeft(${i})"><span class="dot" style="background:${l.color.hex}">${l.color.id}</span><span class="pl">${l.color.name}</span></div>`).join('');
    rightPorts=PZ.right.map((r,i)=>`<div class="port" id="R${i}" onclick="pickRight(${i})"><span class="dot" style="background:${r.color.hex}">${r.color.id}</span><span class="pl">${r.color.name}</span></div>`).join('');
  }
  v.innerHTML=`
   <div class="card">
     <div class="tag">// VERROU 00 — ÉTABLIR LA CONNEXION</div>
     <div class="ttl">${title}</div>
     <div class="sub">${sub}</div>
     <div class="sess">SESSION ${SESSION||'—'} · AGENT ${PID.slice(1,5).toUpperCase()}</div>
     ${instrBlock}
     <div class="board">
       <div class="cols">
         <div class="col left">${leftPorts}</div>
         <div class="col right">${rightPorts}</div>
       </div>
       <svg class="links" id="svglinks"></svg>
     </div>
     <div id="msg" class="msg"></div>
     ${isWire?'<button class="breakerbtn" onclick="flipBreaker()">⏻ ABAISSER LE DISJONCTEUR</button>':''}
     <button class="btn" onclick="resetPuzzle()">↻ Réinitialiser les câbles</button>
     <div id="status" class="status ${online?'on':'off'}">${online?'🌐 connecté au nœud':'⚠ hors ligne — préviens l\'animateur'}</div>
   </div>`;
  drawLinks();
}
function drawLinks(){
  const svg=document.getElementById('svglinks'); if(!svg) return;
  const board=svg.parentElement, br=board.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${br.width} ${br.height}`);
  let h='';
  links.forEach(lk=>{
    const a=document.getElementById('L'+lk.l), b=document.getElementById('R'+lk.r); if(!a||!b) return;
    const ar=a.getBoundingClientRect(), brr=b.getBoundingClientRect();
    const x1=ar.right-br.left-6, y1=ar.top-br.top+ar.height/2;
    const x2=brr.left-br.left+6, y2=brr.top-br.top+brr.height/2;
    h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>`;
  });
  svg.innerHTML=h;
  svg.classList.toggle('tentative', !!(PZ && PZ.variant==='wirebox' && !confirmed));
}
function repaint(){
  document.querySelectorAll('.port').forEach(p=>p.classList.remove('sel','wired','done'));
  links.forEach(lk=>{ const a=document.getElementById('L'+lk.l), b=document.getElementById('R'+lk.r);
    const cls=confirmed?'done':'wired'; if(a)a.classList.add(cls); if(b)b.classList.add(cls); });
  if(selLeft!==null){ const a=document.getElementById('L'+selLeft); if(a)a.classList.add('sel'); }
  drawLinks();
}
window.pickLeft=function(i){
  if(PZ.variant==='wirebox'){
    if(confirmed) return;
    const ex=links.findIndex(l=>l.l===i);
    if(ex>=0){ links.splice(ex,1); selLeft=null; setMsg(''); repaint(); beep(300,.05); return; }
    selLeft=i; setMsg(''); repaint(); return;
  }
  if(links.some(l=>l.l===i)) return;
  selLeft=i;
  document.querySelectorAll('.col.left .port').forEach(p=>p.classList.remove('sel'));
  document.getElementById('L'+i).classList.add('sel');
  setMsg('');
};
window.pickRight=function(j){
  if(PZ.variant==='wirebox'){
    if(confirmed) return;
    const exr=links.findIndex(l=>l.r===j);
    if(exr>=0){ links.splice(exr,1); selLeft=null; setMsg(''); repaint(); beep(300,.05); return; }
    if(selLeft===null){ setMsg('Touchez un code à GAUCHE, puis son jumeau à droite.','err'); return; }
    links.push({l:selLeft, r:j}); selLeft=null; setMsg(''); repaint(); beep(760,.05); return;
  }
  if(selLeft===null){ setMsg('Touchez d\'abord une ENTRÉE à gauche.','err'); return; }
  if(links.some(l=>l.r===j)) return;
  const left=PZ.left[selLeft], right=PZ.right[j];
  if(right.key===left.matchKey){
    links.push({l:selLeft, r:j});
    document.getElementById('L'+selLeft).classList.add('done');
    document.getElementById('L'+selLeft).classList.remove('sel');
    document.getElementById('R'+j).classList.add('done');
    selLeft=null; drawLinks(); beep(880,.05);

let ac=null;
function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(),g=ac.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=.05; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.1)); o.stop(ac.currentTime+(d||.1)); }catch(e){} }
/* Sons glitch perso (même dossier sfx/ que le terminal). "" = bip de synthèse. */
const SFX = { error:"sfx/glitch_error.mp3" };
const SFX_VOL = 0.85; const _sfxc={};
function sfxBase(){ const p=location.pathname.replace(/[^/]*$/,''); return (location.origin==='null'?'':location.origin)+p; }
function sfx(name, fb){
  const f=SFX[name];
  if(f){ try{ if(!_sfxc[name])_sfxc[name]=new Audio(sfxBase()+f); const el=_sfxc[name].cloneNode(); el.volume=SFX_VOL; const pr=el.play(); if(pr&&pr.catch)pr.catch(()=>{if(fb)fb();}); return; }catch(e){} }
  if(fb)fb();
}

/* ---------- 1) MÉMOIRE NEURONALE (Simon) ---------- */
MINI.sequence=function(){
  var PADS=[{c:'#00e5ff',g:'◆'},{c:'#ff2e88',g:'▲'},{c:'#2fff9a',g:'●'},{c:'#ffce54',g:'■'}];
  var rounds=[3,4,5], round=0, seq=[], input=[], lock=true;
  miniShell('// DÉFI COLLECTIF — MÉMOIRE NEURONALE',
    'Séquence neuronale',
    'Mémorisez l\'ordre d\'allumage des nœuds, puis reproduisez-le. 3 séquences à valider. La moindre erreur relance la séquence.',
    '<div id="seqprog" class="mini-prog"></div>'+
    '<div class="pad-grid">'+PADS.map(function(p,i){return '<button class="pad" id="pad'+i+'" style="--pc:'+p.c+'" onclick="seqTap('+i+')"><span>'+p.g+'</span></button>';}).join('')+'</div>'+
    '<button class="btn" id="seqreplay" onclick="seqShow()">↻ Revoir la séquence</button>');
  injectMiniCSS();
  updSeqProg();
  function updSeqProg(){ var e=document.getElementById('seqprog'); if(e) e.innerHTML='SÉQUENCE '+(round+1)+'/3 · longueur '+rounds[round]; }
  window.seqStart=function(){ seq=[]; input=[]; for(var i=0;i<rounds[round];i++) seq.push(Math.floor(Math.random()*4)); updSeqProg(); seqShow(); };
  window.seqShow=function(){ lock=true; input=[]; setMsg('Observez…'); var i=0;
    var iv=setInterval(function(){ if(i>=seq.length){ clearInterval(iv); lock=false; setMsg('À vous : reproduisez la séquence.'); return; }
      flashPad(seq[i]); i++; }, 640); };
  function flashPad(idx){ var el=document.getElementById('pad'+idx); if(!el) return; el.classList.add('lit'); beep(360+idx*140,.18); setTimeout(function(){ el.classList.remove('lit'); }, 360); }
  window.seqTap=function(idx){ if(lock) return; flashPad(idx); input.push(idx);
    var k=input.length-1;
    if(input[k]!==seq[k]){ lock=true; setMsg('✕ Erreur de séquence — on recommence.','err'); beep(130,.25); buzz(120); setTimeout(window.seqShow,700); return; }
    if(input.length===seq.length){ lock=true; round++;
      if(round>=rounds.length){ setMsg('✓ Mémoire synchronisée.','ok'); solved(); }
      else { setMsg('✓ Séquence '+round+' validée.','ok'); beep(1200,.15); setTimeout(window.seqStart,850); } }
  };
  setTimeout(window.seqStart,600);
};

/* ---------- 2) DÉCRYPTAGE BINAIRE ---------- */
MINI.decode=function(){
  var total=4, done=0;
  miniShell('// DÉFI COLLECTIF — DÉCRYPTAGE BINAIRE',
    'Conversion binaire',
    'NEXUS chiffre ses accès en binaire 8 bits. Lisez l\'octet et choisissez sa valeur décimale. 4 octets à décoder.',
    '<div id="decprog" class="mini-prog"></div>'+
    '<div id="decbyte" class="dec-byte"></div>'+
    '<div id="decopts" class="dec-opts"></div>');
  injectMiniCSS();
  function nextByte(){
    var _p=document.getElementById('decprog'), _b=document.getElementById('decbyte'), _o=document.getElementById('decopts');
    if(!_p||!_b||!_o) return;   // vue déjà remplacée (partie gagnée)
    _p.innerHTML='OCTET '+(done+1)+'/'+total;
    var n=20+Math.floor(Math.random()*216); // 20..235
    var bin=('00000000'+n.toString(2)).slice(-8);
    _b.innerHTML=bin.split('').map(function(b){return '<span class="bit b'+b+'">'+b+'</span>';}).join('');
    var opts=[n]; while(opts.length<4){ var d=n+(Math.floor(Math.random()*41)-20); if(d>=0&&d<=255&&opts.indexOf(d)<0) opts.push(d); }
    for(var i=opts.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=opts[i];opts[i]=opts[j];opts[j]=t; }
    _o.innerHTML=opts.map(function(o){return '<button class="opt-btn" onclick="decPick('+o+','+n+')">'+o+'</button>';}).join('');
    setMsg('Convertissez l\'octet en décimal.');
  }
  window.decPick=function(choice,ans){
    if(choice===ans){ done++; beep(1046,.14); if(done>=total){ setMsg('✓ Clé reconstituée.','ok'); solved(); } else { setMsg('✓ Octet validé.','ok'); setTimeout(nextByte,500); } }
    else { setMsg('✕ Mauvaise valeur — recalculez (poids : 128·64·32·16·8·4·2·1).','err'); beep(130,.22); buzz(120); }
  };
  nextByte();
};

/* ---------- 3) PURGE DES INTRUSIONS (réflexe) ---------- */
MINI.reflex=function(){
  var TARGET=15, hit=0, live=true, timer=null;
  miniShell('// DÉFI COLLECTIF — PURGE DES INTRUSIONS',
    'Purge active',
    'Des processus hostiles s\'infiltrent dans votre nœud. Touchez-les pour les purger. Atteignez '+TARGET+' purges pour sécuriser le nœud.',
    '<div id="rxprog" class="mini-prog"></div>'+
    '<div class="rx-grid" id="rxgrid">'+[0,1,2,3,4,5,6,7,8].map(function(i){return '<button class="rx-cell" id="rx'+i+'" onclick="rxTap('+i+')"></button>';}).join('')+'</div>');
  injectMiniCSS();
  function upd(){ var e=document.getElementById('rxprog'); if(e) e.innerHTML='PURGES '+hit+'/'+TARGET; }
  upd(); setMsg('Touchez les intrusions rouges dès qu\'elles apparaissent.');
  var active=-1;
  function spawn(){ if(!live) return;
    if(active>=0){ var old=document.getElementById('rx'+active); if(old) old.classList.remove('intr'); }
    active=Math.floor(Math.random()*9);
    var el=document.getElementById('rx'+active); if(el) el.classList.add('intr');
    timer=setTimeout(spawn, 820-Math.min(400,hit*22));
  }
  window.rxTap=function(i){ if(!live) return;
    if(i===active){ hit++; beep(900+hit*18,.06); var el=document.getElementById('rx'+i); if(el){el.classList.remove('intr');el.classList.add('purged');setTimeout(function(){el.classList.remove('purged');},160);} active=-1; upd();
      if(hit>=TARGET){ live=false; clearTimeout(timer); setMsg('✓ Nœud purgé — intrusion neutralisée.','ok'); solved(); return; }
    } else { beep(150,.08); buzz(60); }
  };
  spawn();
};


/* ---------- 4) COFFRE FRÉQUENTIEL (inspiré du coffre portable RE2R) ---------- */
MINI.freqlock=function(){
  var ROUNDS=3, round=0, TOL=3.4, HOLD=650;
  var ch=[{T:0,C:0,lock:false,ph:0},{T:0,C:0,lock:false,ph:0}];
  var holding=false, holdStart=0, raf=null;
  function channelHTML(i){
    return '<div class="fl-ch" id="flch'+i+'" data-i="'+i+'">'+
      '<div class="fl-head"><span class="fl-lbl">CANAL '+(i===0?'A':'B')+'</span><span class="fl-stat" id="flst'+i+'">○ libre</span></div>'+
      '<canvas class="fl-cv" id="flcv'+i+'" width="300" height="74"></canvas>'+
      '<div class="fl-knobrow"><div class="fl-knob" id="flkn'+i+'"><i></i></div><span class="fl-hint">↕ glissez pour tourner la molette</span></div>'+
    '</div>';
  }
  miniShell('// DÉFI COLLECTIF — SYNCHRONISATION FRÉQUENTIELLE',
    'Coffre fréquentiel',
    'Le module NEXUS est scellé par un double verrou. Tournez chaque molette pour aligner son signal (plein) sur la fréquence cible (pointillés). Maintenez les DEUX canaux alignés en même temps pour ouvrir. 3 paliers.',
    '<div id="flprog" class="mini-prog"></div>'+
    '<div class="fl-wrap">'+channelHTML(0)+channelHTML(1)+'</div>');
  injectMiniCSS(); injectFreqCSS();
  function freqOf(v){ return 2 + (v/100)*9; }
  function newRound(){
    for(var i=0;i<2;i++){ var c=ch[i]; c.T=16+Math.random()*68; do{ c.C=10+Math.random()*80; }while(Math.abs(c.C-c.T)<24); c.lock=false; }
    var p=document.getElementById('flprog'); if(p) p.innerHTML='PALIER '+(round+1)+'/'+ROUNDS;
    setMsg('Alignez les deux canaux, puis maintenez.'); updStat();
  }
  function drawWave(g,W,H,freq,ph,col,lw,dashed){
    g.beginPath(); g.lineWidth=lw; g.strokeStyle=col; if(dashed)g.setLineDash([4,5]);else g.setLineDash([]);
    for(var x=0;x<=W;x+=2){ var y=H/2 + Math.sin((x/W)*freq*Math.PI*2 + ph)*(H/2-7); if(x===0)g.moveTo(x,y);else g.lineTo(x,y); }
    g.stroke(); g.setLineDash([]);
  }
  function draw(){
    raf=requestAnimationFrame(draw);
    for(var i=0;i<2;i++){
      var cv=document.getElementById('flcv'+i); if(!cv){ if(raf)cancelAnimationFrame(raf); return; }
      var g=cv.getContext('2d'), W=cv.width, H=cv.height; g.clearRect(0,0,W,H);
      ch[i].ph+=0.05;
      drawWave(g,W,H,freqOf(ch[i].T),ch[i].ph,'rgba(130,150,170,.5)',1,true);
      var near=Math.abs(ch[i].C-ch[i].T)<=TOL;
      drawWave(g,W,H,freqOf(ch[i].C),ch[i].ph, near?'#2fff9a':'#ff2e88',2.4,false);
      var kn=document.getElementById('flkn'+i); if(kn) kn.style.transform='rotate('+((ch[i].C/100)*280-140)+'deg)';
    }
    checkLock();
  }
  function updStat(){
    for(var i=0;i<2;i++){ var e=document.getElementById('flst'+i); if(e){ e.textContent=ch[i].lock?'● VERROUILLÉ':'○ libre'; e.className='fl-stat'+(ch[i].lock?' on':''); } }
  }
  function checkLock(){
    var a=Math.abs(ch[0].C-ch[0].T)<=TOL, b=Math.abs(ch[1].C-ch[1].T)<=TOL;
    if(ch[0].lock!==a){ ch[0].lock=a; if(a)beep(900,.06); updStat(); }
    if(ch[1].lock!==b){ ch[1].lock=b; if(b)beep(1120,.06); updStat(); }
    if(a&&b){
      if(!holding){ holding=true; holdStart=performance.now(); setMsg('✓ Verrous alignés — maintenez…','ok'); }
      else if(performance.now()-holdStart>=HOLD){
        holding=false; round++;
        if(round>=ROUNDS){ setMsg('✓ Coffre déverrouillé.','ok'); beep(1320,.22); if(raf)cancelAnimationFrame(raf); solved(); }
        else { setMsg('✓ Palier '+round+' synchronisé.','ok'); beep(1200,.15); setTimeout(newRound,520); }
      }
    } else if(holding){ holding=false; setMsg('Alignez les deux canaux, puis maintenez.'); }
  }
  function bindCh(i){
    var el=document.getElementById('flch'+i); if(!el) return;
    var startY=0,startC=0,active=false,lastTick=99;
    el.addEventListener('pointerdown',function(e){ active=true; startY=e.clientY; startC=ch[i].C; try{el.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); },{passive:false});
    el.addEventListener('pointermove',function(e){ if(!active)return; e.preventDefault();
      var nc=Math.max(0,Math.min(100,startC+(startY-e.clientY)*0.6)); ch[i].C=nc;
      var d=Math.abs(nc-ch[i].T); var t=Math.floor(nc);
      if(t!==lastTick && d<16){ lastTick=t; beep(440+(16-d)*42,.018); }
    },{passive:false});
    el.addEventListener('pointerup',function(){ active=false; });
    el.addEventListener('pointercancel',function(){ active=false; });
  }
  bindCh(0); bindCh(1);
  newRound(); draw();
};
